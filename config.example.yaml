  #   - name: DeepSeek
  #     type: deepseek
  #     base_url: https://api.deepseek.com
  #     api_key: sk-xxxxxxxx
  #     models:
  #       - name: deepseek-chat
  #         supports_tools: true
  #       - name: deepseek-v4-flash         # 思考模式模型示例
  #         supports_forced_tool_choice: false
  #         supports_json_object: true
  #         input_price: 2
  #         output_price: 8
  #   - name: Kimi
  #     type: moonshot
  #     base_url: https://api.moonshot.cn/v1
  #     api_key: sk-xxxxxxxx
  #     models:
  #       - name: kimi-k2-0905-preview
  #   - name: 火山方舟
  #     type: volcengine
  #     base_url: https://ark.cn-beijing.volces.com/api/v3
  #     api_key: xxxxxxxx
  #     models:
  #       - name: ep-xxxxxxxx-xxxxx    # 推理接入点 ID
  #   - name: 通义千问
  #     type: dashscope
  #     base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  #     api_key: sk-xxxxxxxx
  #     models:
  #       - name: qwen-plus
  #   - name: OpenAI
  #     type: openai
  #     base_url: https://api.openai.com/v1
  #     api_key: sk-xxxxxxxx
  #     models:
  #       - name: gpt-4.1-mini
  bindings: {}
  # 智能体角色与模型绑定，格式“供应方名称/模型名”；至少配置 default
  # 角色：default requirement_compiler coordinator search_planner browser_researcher
  #       extractor verifier analyst report_writer
  # bindings:
  #   default:          {model: DeepSeek/deepseek-chat}
