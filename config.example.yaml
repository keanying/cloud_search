# =====================================================================
# 云搜浏览器 统一配置文件模板
#   复制为 config.yaml 后修改（启动脚本首次运行会自动复制）。
#   config.yaml 含密码和 API Key，已被 .gitignore 忽略，不会提交到仓库。
#   优先级：环境变量 CS_xxx > config.yaml > 程序默认值
#   留空或删除某一项 = 使用默认值；写错键名会在启动时报错提示。
# =====================================================================

app:
  env: dev                      # dev / prod

# ---------------------------------------------------------------- 服务监听
server:
  host: 127.0.0.1               # 只本机访问；服务器上对外提供服务改为 0.0.0.0
  port: 8000                    # 页面与接口同一个端口：http://host:port

# ---------------------------------------------------------------- 数据库（应用状态库 cloudsearch_app）
database:
  type: sqlite                  # sqlite（本地开发，零安装）或 mysql（生产）
  sqlite_path: backend/data/cloudsearch.db   # 相对仓库根目录
  mysql:
    host: 127.0.0.1
    port: 3306
    user: cs
    password: cs_pass
    name: cloudsearch_app       # 需提前建库：CREATE DATABASE cloudsearch_app CHARACTER SET utf8mb4;
    charset: utf8mb4
  # url: mysql+asyncmy://user:pwd@host:3306/cloudsearch_app?charset=utf8mb4   # 填写后优先于上面的分项
  auto_create_tables: true      # 开发方便自动建表；生产建议 false，由脚本执行 alembic 迁移

# ---------------------------------------------------------------- 安全（生产必须修改）
security:
  secret_key: dev-only-secret-change-me-in-production-0123456789   # JWT 签名密钥，≥32 个字符的随机串
  # API Key 加密主密钥（Fernet）。生成：.venv 中执行
  #   python -c "from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())"
  # 注意：设置后不要再改，否则已保存的 API Key 无法解密，需要重新填写
  master_key:
  access_token_minutes: 1440    # 登录有效期（分钟）
  allow_registration: true      # 是否开放注册；第一个注册的账号自动成为管理员

# ---------------------------------------------------------------- 云端浏览器
browser:
  headless: true                # 调试时可改 false 看到浏览器窗口（仅本机）
  # 浏览器内核：auto = 已下载自带 Chromium 就用它，否则直接用系统已安装的 Edge（Windows 自带）或 Chrome，无需下载；
  #             都没有时（例如 Linux 服务器）才自动从多个源下载 Chromium
  #             bundled = 只用自带 Chromium（会自动下载）；msedge / chrome = 指定系统浏览器
  channel: auto
  executable_path:              # 可选：指定浏览器 exe 的完整路径，填写后优先
  proxy:                        # 出网代理，例如 http://127.0.0.1:7890；留空直连
  max_contexts: 4               # 同时打开的浏览器上下文上限（每个约 150-300MB 内存）
  nav_timeout_ms: 30000
  frame_interval_s: 2.0         # 右侧阅览画面的截图间隔
  locale: zh-CN
  allow_private_network: false  # 允许访问内网地址（仅测试用，生产必须 false）

# ---------------------------------------------------------------- 浏览器搜索（不使用搜索API）
search:
  # 通用引擎顺序（可选 duckduckgo / google / bing / baidu / sogou）。默认优先 DuckDuckGo；
  # 被拦截、网络不可达或返回无关结果时自动换下一个。中国大陆网络访问 DuckDuckGo/Google 通常需要设置 browser.proxy。
  engines: [duckduckgo, google, bing, baidu, sogou]
  strategy: priority            # priority：总是先用第一个，失败才换；rotate：每次查询轮换起始引擎分散负载
  engine_cooldown_s: 600        # 被验证码拦截后的冷却时间（秒）
  unreachable_cooldown_s: 300   # 网络不可达后的冷却时间（秒），避免每次都等超时
  # 垂直来源：搜索规划会按意图为某些查询选择这些网站的站内搜索（无结果时回退到通用引擎）
  # 内置：wikipedia_zh 中文维基、wikipedia_en 英文维基、baike 百度百科、weixin 微信公众号文章、github、arxiv 论文
  vertical_sources:             # 留空 = 全部内置来源可用；例如只用两个：[baike, weixin]
  # 自定义来源：任何有站内搜索的网站都可以加，{q} 为查询词。选择器用浏览器开发者工具查看结果列表的结构。
  custom_sources: []
  # custom_sources:
  #   - name: gov_cn
  #     label: 中国政府网
  #     description: 国家政策、法规、官方通知
  #     url: https://sousuo.www.gov.cn/sousuo/search.shtml?code=17da70961a7&searchWord={q}
  #     item: .middle_result_con li        # 每条结果的容器
  #     link: a                              # 容器内的链接
  #     snippet: .res_text                   # 容器内的摘要（可选）
  results_per_query: 8

# ---------------------------------------------------------------- 单个任务的上限
task:
  max_sources: 12               # 最多读取的网页数
  max_queries: 6                # 最多搜索次数
  read_concurrency: 3           # 并行读取的浏览器会话数
  max_llm_requests: 60          # 最多模型请求次数（防止费用失控）
  max_extra_waves: 2            # 研究类任务按子问题评估覆盖后针对缺口补查的最多轮数（数据任务最多 1 轮）

# ---------------------------------------------------------------- 上传文件
# 对话里可以上传文件（PDF、Word、Excel/CSV、PPT、图片、TXT/Markdown/HTML 等），解析成 Markdown 后作为可引用的来源，
# 用于文件问答、总结、提取表格、结合网上资料核对等。长文档会按章节/页码拆成多个来源，引用会标到具体部分。
files:
  max_mb: 100                   # 单个文件大小上限
  max_per_message: 10           # 一条消息最多附带的文件数
  # 解析器：auto（推荐）/ builtin / mineru_api / mineru_cloud / mineru_cli / mineru_agent
  #   auto：表格与文本类文件用内置解析；PDF/图片/Office 按 MinerU 自部署 → MinerU 云端（配了 Token 才用）→ MinerU 命令行 → 内置 的顺序选择，
  #         MinerU 不可用时能内置解析的格式会自动回退（扫描件、图片、PPT 没有兜底，需要 MinerU）。
  #   mineru_agent：mineru.net 免登录轻量接口（≤10MB/20 页，按 IP 限流），文件会上传到 mineru.net，只在显式选择时使用。
  parser: auto
  parse_concurrency: 2          # 每个 worker 同时解析的文件数
  parse_timeout_s: 1800         # 单个文件解析超时（大 PDF 走 MinerU 可能需要几分钟）

# ---------------------------------------------------------------- MinerU 多模态文档解析
# MinerU（opendatalab/MinerU）把 PDF、扫描件、图片、Office 文档解析成带表格/公式/版面结构的 Markdown。接入方式任选：
# 0) 本机托管（最省事，数据不出本机）：local: true。启动脚本（start.bat / run.py / scripts/server.sh）会自动
#    安装 MinerU 到 .venv-mineru、下载模型到 .mineru/models（之后离线运行）、随主程序启动/停止 MinerU 服务。
# 1) 自部署在另一台机器（如 GPU 服务器）：在那台机器上
#      uv pip install -U "mineru>=4.0,<5"
#      mineru-kit models download --tier standard --source modelscope
#      MINERU_MODEL_SOURCE=local mineru-kit api-server --host 0.0.0.0 --port 8002 --tier standard
#    然后填 api_url: http://那台机器:8002（也兼容 mineru-kit file-parse-server 与旧版 mineru-api）。
# 2) mineru.net 云端精准解析：在 mineru.net 申请 API Token 填到 cloud_token（单文件 ≤200MB/200 页；文件会发送到 mineru.net）。
# 3) 本机命令行：本机已安装 MinerU 时，按 cli_command 调用（{input}/{output}/{output_dir} 会被替换）。
mineru:
  local: false                  # true = 本机托管 MinerU（见上方说明 0）；开启后文件只在本机解析，绝不发往 mineru.net
                                #   （与大模型无关：大模型仍可用 DeepSeek 等厂商，见 privacy 分区说明）
  local_port: 8002              # 本机 MinerU 端口（只监听 127.0.0.1；不要与 server.port 相同）
  model_source: modelscope      # 首次下载模型的来源：modelscope（国内快）/ huggingface（失败会自动换另一个）
  extras: ""                    # 空 = 基础版（CPU/核显即可）；torch 或 full = NVIDIA 显卡加速（下载更大）
  api_url:                      # 例：http://10.0.0.8:8002（自部署在其他机器时填写；本机托管时留空）
  api_key:                      # 自部署服务前有网关鉴权时填写（Bearer）
  tier: standard                # flash / basic / standard / advanced（越高越准、越慢）
                                #   basic：OCR+表格+公式，CPU 可用，模型约 0.8GB；standard：再加视觉大模型，复杂版面更准，
                                #   建议 16GB 内存且 12 核以上或有显卡；只做文字版文档可用 flash（不需要模型）
  cloud_token:                  # mineru.net API Token；留空则不使用云端
  cloud_model: vlm              # pipeline / vlm
  language: ch                  # 文档主要语言（OCR 用）
  cli_command: [mineru, parse, "{input}", -o, "{output}", --pages, all]

# ---------------------------------------------------------------- 数据不出域
# 开启后：大模型只调用本机/内网地址（公网供应方会被拒绝）；文件解析不使用 mineru.net；涉及上传文件的任务不联网搜索。
# 不涉及文件的公开信息搜索仍可使用（搜索本身就是访问公网）。详见 docs/deploy-local.md
privacy:
  data_local_only: false
  allowed_hosts: []             # 额外视为内网的域名，如公司内部大模型网关 [llm.corp.example]

# ---------------------------------------------------------------- 本地大模型（Ollama，可选）
# 填写模型后，启动脚本会确保 Ollama 在运行并自动拉取这些模型，同时登记为“本地模型（Ollama）”供应方；
# 还没有默认模型时，第一个模型会被设为默认模型。需要先安装 Ollama：https://ollama.com/download
local_llm:
  ollama_url: http://127.0.0.1:11434
  ollama_models: []             # 例：[qwen3:8b]；显存充足可用 qwen3:32b（智能体需要工具调用/JSON 输出能力）

# ---------------------------------------------------------------- 后台执行器
worker:
  embedded: true                # true：执行器嵌在 API 进程内（单进程，适合开发/小规模）
                                # false：需要单独启动 worker（服务器脚本会自动处理）
  processes: 1                  # embedded=false 时，服务器脚本启动的独立 worker 进程数
  max_tasks: 2                  # 每个执行器同时运行的任务数
  lease_s: 60
  poll_interval_s: 1.0

# ---------------------------------------------------------------- 文件存储
storage:
  dir: backend/data/storage     # 来源正文、截图、导出文件（相对仓库根目录）

# ---------------------------------------------------------------- 安装源（仅 run.py / 服务器脚本安装依赖时使用）
# 留空 = 自动测速：并发测试各源延迟，按从快到慢依次尝试，某个源失败或卡住会自动换下一个。
#   Python 包：官方 PyPI、清华、阿里云、腾讯云、华为云
#   前端包：  官方 npm、阿里云 npmmirror、腾讯云、华为云
#   Chromium：官方、阿里云 npmmirror、华为云（清华/腾讯没有该镜像）
# 也可以指定只用哪些源及顺序，例如：
#   pip_index_urls: [https://pypi.tuna.tsinghua.edu.cn/simple, https://mirrors.aliyun.com/pypi/simple]
#   npm_registries: [https://registry.npmmirror.com]
#   playwright_download_hosts: [https://cdn.npmmirror.com/binaries/playwright]
install:
  pip_index_urls: []
  npm_registries: []
  playwright_download_hosts: []

# ---------------------------------------------------------------- 大模型（可选，也可在页面“管理后台 → 大模型”中配置）
# 启动时同步进数据库：这里列出的供应方/模型/绑定以本文件为准；页面上另外添加的不受影响。
# 单价单位：元 / 百万 token。未知可留空（费用记为“未知”，不会记 0）。
# 能力勾选以供应方文档为准：不支持工具调用的模型请设 supports_tools: false，系统会改用提示词约束输出。
# 思考模式模型（如 DeepSeek V4、Kimi K2.5+、豆包/千问思考版）通常不接受强制工具调用，可设 supports_forced_tool_choice: false；
# 不填也可以：首次调用被拒时系统会自动识别、降级重试并记住。
llm:
  providers: []
  # providers:
  #   - name: DeepSeek
  #     type: deepseek
  #     base_url: https://api.deepseek.com
  #     api_key: sk-xxxxxxxx
  #     models:
  #       - name: deepseek-chat
  #         supports_tools: true
  #       - name: deepseek-v4-flash         # 思考模式模型示例
  #         supports_forced_tool_choice: false
  #         supports_json_object: true
  #         input_price: 2
  #         output_price: 8
  #   - name: Kimi
  #     type: moonshot
  #     base_url: https://api.moonshot.cn/v1
  #     api_key: sk-xxxxxxxx
  #     models:
  #       - name: kimi-k2-0905-preview
  #   - name: 火山方舟
  #     type: volcengine
  #     base_url: https://ark.cn-beijing.volces.com/api/v3
  #     api_key: xxxxxxxx
  #     models:
  #       - name: ep-xxxxxxxx-xxxxx    # 推理接入点 ID
  #   - name: 通义千问
  #     type: dashscope
  #     base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  #     api_key: sk-xxxxxxxx
  #     models:
  #       - name: qwen-plus
  #   - name: OpenAI
  #     type: openai
  #     base_url: https://api.openai.com/v1
  #     api_key: sk-xxxxxxxx
  #     models:
  #       - name: gpt-4.1-mini
  bindings: {}
  # 智能体角色与模型绑定，格式“供应方名称/模型名”；至少配置 default
  # 角色：default requirement_compiler coordinator search_planner browser_researcher
  #       extractor verifier analyst report_writer
  # bindings:
  #   default:          {model: DeepSeek/deepseek-chat}
  #   extractor:        {model: DeepSeek/deepseek-chat, fallbacks: [通义千问/qwen-plus], temperature: 0}
  #   report_writer:    {model: Kimi/kimi-k2-0905-preview, fallbacks: [DeepSeek/deepseek-chat]}
