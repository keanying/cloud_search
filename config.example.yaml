# =====================================================================
# 云搜浏览器 统一配置文件模板
#   复制为 config.yaml 后修改（启动脚本首次运行会自动复制）。
#   config.yaml 含密码和 API Key，已被 .gitignore 忽略，不会提交到仓库。
#   优先级：环境变量 CS_xxx > config.yaml > 程序默认值
#   留空或删除某一项 = 使用默认值；写错键名会在启动时报错提示。
# =====================================================================

app:
  env: dev                      # dev / prod

# ---------------------------------------------------------------- 服务监听
server:
  host: 127.0.0.1               # 只本机访问；服务器上对外提供服务改为 0.0.0.0
  port: 8000                    # 页面与接口同一个端口：http://host:port

# ---------------------------------------------------------------- 数据库（应用状态库 cloudsearch_app）
database:
  type: sqlite                  # sqlite（本地开发，零安装）或 mysql（生产）
  sqlite_path: backend/data/cloudsearch.db   # 相对仓库根目录
  mysql:
    host: 127.0.0.1
    port: 3306
    user: cs
    password: cs_pass
    name: cloudsearch_app       # 需提前建库：CREATE DATABASE cloudsearch_app CHARACTER SET utf8mb4;
    charset: utf8mb4
  # url: mysql+asyncmy://user:pwd@host:3306/cloudsearch_app?charset=utf8mb4   # 填写后优先于上面的分项
  auto_create_tables: true      # 开发方便自动建表；生产建议 false，由脚本执行 alembic 迁移

# ---------------------------------------------------------------- 安全（生产必须修改）
security:
  secret_key: dev-only-secret-change-me-in-production-0123456789   # JWT 签名密钥，≥32 个字符的随机串
  # API Key 加密主密钥（Fernet）。生成：.venv 中执行
  #   python -c "from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())"
  # 注意：设置后不要再改，否则已保存的 API Key 无法解密，需要重新填写
  master_key:
  access_token_minutes: 1440    # 登录有效期（分钟）
  allow_registration: true      # 是否开放注册；第一个注册的账号自动成为管理员

# ---------------------------------------------------------------- 云端浏览器
browser:
  headless: true                # 调试时可改 false 看到浏览器窗口（仅本机）
  # 浏览器内核：auto = 已下载自带 Chromium 就用它，否则直接用系统已安装的 Edge（Windows 自带）或 Chrome，无需下载；
  #             都没有时（例如 Linux 服务器）才自动从多个源下载 Chromium
  #             bundled = 只用自带 Chromium（会自动下载）；msedge / chrome = 指定系统浏览器
  channel: auto
  executable_path:              # 可选：指定浏览器 exe 的完整路径，填写后优先
  proxy:                        # 出网代理，例如 http://127.0.0.1:7890；留空直连
  max_contexts: 4               # 同时打开的浏览器上下文上限（每个约 150-300MB 内存）
  nav_timeout_ms: 30000
  frame_interval_s: 2.0         # 右侧阅览画面的截图间隔
  locale: zh-CN
  allow_private_network: false  # 允许访问内网地址（仅测试用，生产必须 false）

# ---------------------------------------------------------------- 浏览器搜索（不使用搜索API）
search:
  # 引擎顺序（可选 duckduckgo / bing / baidu / sogou）。默认优先 DuckDuckGo；
  # 被拦截、网络不可达或返回无关结果时自动换下一个。中国大陆网络访问 DuckDuckGo 通常需要设置 browser.proxy。
  engines: [duckduckgo, bing, baidu, sogou]
  strategy: priority            # priority：总是先用第一个，失败才换；rotate：每次查询轮换起始引擎分散负载
  engine_cooldown_s: 600        # 被验证码拦截后的冷却时间（秒）
  unreachable_cooldown_s: 300   # 网络不可达后的冷却时间（秒），避免每次都等超时
  results_per_query: 8

# ---------------------------------------------------------------- 单个任务的上限
task:
  max_sources: 12               # 最多读取的网页数
  max_queries: 6                # 最多搜索次数
  read_concurrency: 3           # 并行读取的浏览器会话数
  max_llm_requests: 60          # 最多模型请求次数（防止费用失控）

# ---------------------------------------------------------------- 后台执行器
worker:
  embedded: true                # true：执行器嵌在 API 进程内（单进程，适合开发/小规模）
                                # false：需要单独启动 worker（服务器脚本会自动处理）
  processes: 1                  # embedded=false 时，服务器脚本启动的独立 worker 进程数
  max_tasks: 2                  # 每个执行器同时运行的任务数
  lease_s: 60
  poll_interval_s: 1.0

# ---------------------------------------------------------------- 文件存储
storage:
  dir: backend/data/storage     # 来源正文、截图、导出文件（相对仓库根目录）

# ---------------------------------------------------------------- 安装源（仅 run.py / 服务器脚本安装依赖时使用）
# 留空 = 自动测速：并发测试各源延迟，按从快到慢依次尝试，某个源失败或卡住会自动换下一个。
#   Python 包：官方 PyPI、清华、阿里云、腾讯云、华为云
#   前端包：  官方 npm、阿里云 npmmirror、腾讯云、华为云
#   Chromium：官方、阿里云 npmmirror、华为云（清华/腾讯没有该镜像）
# 也可以指定只用哪些源及顺序，例如：
#   pip_index_urls: [https://pypi.tuna.tsinghua.edu.cn/simple, https://mirrors.aliyun.com/pypi/simple]
#   npm_registries: [https://registry.npmmirror.com]
#   playwright_download_hosts: [https://cdn.npmmirror.com/binaries/playwright]
install:
  pip_index_urls: []
  npm_registries: []
  playwright_download_hosts: []

# ---------------------------------------------------------------- 大模型（可选，也可在页面“管理后台 → 大模型”中配置）
# 启动时同步进数据库：这里列出的供应方/模型/绑定以本文件为准；页面上另外添加的不受影响。
# 单价单位：元 / 百万 token。未知可留空（费用记为“未知”，不会记 0）。
# 能力勾选以供应方文档为准：不支持工具调用的模型请设 supports_tools: false，系统会改用提示词约束输出。
# 思考模式模型（如 DeepSeek V4、Kimi K2.5+、豆包/千问思考版）通常不接受强制工具调用，可设 supports_forced_tool_choice: false；
# 不填也可以：首次调用被拒时系统会自动识别、降级重试并记住。
llm:
  providers: []
