[project]
name = "cloudsearch"
version = "0.1.0"
description = "云搜浏览器后端：会话API、八智能体、云端浏览器搜索与采集"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.32",
  "alembic>=1.13",
  "asyncmy>=0.2.9",
  "aiosqlite>=0.20",
  "redis>=5.0",
  "pydantic-ai-slim[openai]>=1.0",
  "playwright==1.63.0",
  "trafilatura>=1.12",
  "httpx>=0.27",
  "cryptography>=43",
  "pyjwt>=2.9",
  "bcrypt>=4.2",
  "python-multipart>=0.0.9",
  "sse-starlette>=2.1",
  "duckdb>=1.1",
  "openpyxl>=3.1",
  "tldextract>=5.1",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cloudsearch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
